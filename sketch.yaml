# arduino-cli sketch profile - pins the core and library versions so the build
# is reproducible (locally and in CI).
#   arduino-cli compile --profile default MeteoPlaneRadar
#
# WiFiManager was dropped in 0.6.0: the configuration portal is now served by
# the project's own web server, which speaks both languages and does not block
# the main loop. Nothing replaced it - WebServer, DNSServer and ESPmDNS all
# come with the ESP32 core.
profiles:
  default:
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom,CDCOnBoot=cdc,FlashMode=qio
    platforms:
      - platform: esp32:esp32 (3.0.7)
    libraries:
      - GFX Library for Arduino (1.4.9)
      - PNGdec (1.0.1)
      - ArduinoJson (7.1.0)
      - ElegantOTA (3.1.6)

default_profile: default
