# arduino-cli sketch profile - pins the core and library versions so the build
# is reproducible (locally and in CI).
#   arduino-cli compile --profile default MeteoPlaneRadar
#
# Two libraries were dropped and nothing replaced them, because WebServer,
# DNSServer, ESPmDNS and Update all come with the ESP32 core:
#   0.6.0 - WiFiManager. The configuration portal is served by the project's own
#           web server, which speaks both languages and does not block the loop.
#   0.6.2 - ElegantOTA. It is AGPL-3.0, which would have made every binary built
#           from this project AGPL too. /update is now our own page.
profiles:
  default:
    fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom,CDCOnBoot=cdc,FlashMode=qio
    platforms:
      - platform: esp32:esp32 (3.0.7)
    libraries:
      - GFX Library for Arduino (1.4.9)
      - PNGdec (1.0.1)
      - ArduinoJson (7.1.0)

default_profile: default
